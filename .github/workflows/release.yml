name: Release

# Publishes an installable APK as a GitHub Release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# The app's built-in updater downloads exactly this APK.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.2.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Work out the version from the tag
        id: version
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 (three numbers)"; exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::minor and patch must be 0-99 (versionCode = major*10000 + minor*100 + patch)"; exit 1
          fi
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "Version ${major}.${minor}.${patch} (versionCode ${code})"

      - name: Check that signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/RELEASING.uk.md. Without one stable signing key, installed apps cannot be updated."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      # A release is only published from code whose tests pass.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Check the signature and name the file
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$src" | tee signature.txt
          if grep -qi "Android Debug" signature.txt; then
            echo "::error::The APK is signed with the debug key, not the release key"; exit 1
          fi
          out="ToDoList-${TAG}.apk"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          cat "$out.sha256"

      - name: Test report for the release notes
        if: always()
        run: |
          python3 -I tools/ci/make_report.py \
            --tests-dir app/build/test-results/testDebugUnitTest \
            --compact --out test-summary.md || true
          [ ! -f test-summary.md ] || cat test-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            if [ -n "$prev" ]; then range="$prev..$TAG"; else range="$TAG"; fi
            git log --no-merges --pretty='- %s' "$range" | head -n 40
            echo
            echo "## Quality"
            cat test-summary.md 2>/dev/null || echo "No test summary available."
            echo
            echo "## Install"
            echo "Download \`ToDoList-${TAG}.apk\` below, or open **Menu → Check for updates** in an installed copy of the app."
            echo "SHA-256 is in \`ToDoList-${TAG}.apk.sha256\`."
          } > release-notes.md
          cat release-notes.md

      - name: Publish the GitHub Release
        run: |
          files="${{ steps.apk.outputs.file }} ${{ steps.apk.outputs.file }}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" $files --title "ToDoList ${TAG}" --notes-file release-notes.md --verify-tag
          fi

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          if-no-files-found: ignore
          path: |
            release-notes.md
            signature.txt
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
